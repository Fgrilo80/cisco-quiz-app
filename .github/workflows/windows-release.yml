# Windows desktop release for Cisco Quiz 1.2.9+11.
# Remote path when DESKTOP-FGRILO cannot run a local Shell build.

name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - app
      # Feature branches so the zip can be built before merge to app.
      - "cursor/**"
    tags:
      - "v1.2.9"
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-release.yml"
      - "lib/**"
      - "windows/**"
      - "assets/cricket.json"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          architecture: x64

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Check version and bundled bank
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)\s*$' | Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec.yaml has no version line.' }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          if ($version -ne '1.2.9+11') {
            throw "Expected pubspec version 1.2.9+11 (found '$version')."
          }
          $bank = Get-Content -Raw -Path assets/cricket.json
          $count = ([regex]::Matches($bank, '"question"\s*:')).Count
          if ($count -ne 1230) {
            throw "Bundled bank has $count questions; expected 1230."
          }
          Write-Host "Version $version, bundled questions $count"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Release contents
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $exe = Join-Path $release "cisco_quiz.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }
          if (Test-Path "CiscoQuiz-1.2.9-Windows.zip") {
            Remove-Item -Force "CiscoQuiz-1.2.9-Windows.zip"
          }
          tar.exe -a -cf "CiscoQuiz-1.2.9-Windows.zip" -C $release .
          $listing = tar.exe -tf "CiscoQuiz-1.2.9-Windows.zip"
          $listing | Select-String -Pattern "cisco_quiz.exe" -SimpleMatch | Out-Host
          if (-not ($listing | Select-String -Pattern "cisco_quiz.exe" -SimpleMatch)) {
            throw "Zip is missing cisco_quiz.exe"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CiscoQuiz-1.2.9-Windows
          path: CiscoQuiz-1.2.9-Windows.zip
          if-no-files-found: error
          compression-level: 0

      - name: Attach zip to release v1.2.9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = "${{ github.repository }}"
          gh release view v1.2.9 --repo $repo
          if ($LASTEXITCODE -ne 0) {
            $notes = @'
## Cisco Quiz 1.2.9+11

- Banco Cricket main 02c0a868 (pos length-bias): classicos 1190 (CCST 196, CCNA 202, CCNP 197 x PT/EN) + Ciberseguranca 20x2 (1230 total).
- O numero de perguntas nao muda; o texto das opcoes (distratores) foi reescrito.
- Site: https://fgrilo80.github.io/cricket/

### Ficheiros
- CiscoQuiz-1.2.9-arm64.apk — telemoveis modernos. Assinado com a debug keystore do projeto (nao ha keystore de release no repositorio).
- CiscoQuiz-1.2.9-Windows.zip — conteudo de build/windows/x64/runner/Release na raiz do zip.
'@
            gh release create v1.2.9 --repo $repo --target "${{ github.sha }}" --title "Cisco Quiz 1.2.9 — 1230 perguntas" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
          }
          Write-Host "Assets before upload:"
          gh release view v1.2.9 --repo $repo --json assets --jq ".assets[].name"
          gh release upload v1.2.9 "CiscoQuiz-1.2.9-Windows.zip" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
          Write-Host "Assets after upload:"
          gh release view v1.2.9 --repo $repo --json assets --jq ".assets[].name"
