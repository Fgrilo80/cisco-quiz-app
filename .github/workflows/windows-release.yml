# Windows desktop release for Cisco Quiz 1.3.0+14.
# Remote path when DESKTOP-FGRILO cannot run a local Shell build.

name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - app
      # Feature branches so the zip can be built before merge to app.
      - "cursor/**"
    tags:
      - "v1.3.0"
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-release.yml"
      - "lib/**"
      - "windows/**"
      - "assets/cricket.json"
      - "assets/quiz-catalog.json"
      - ".gitattributes"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          architecture: x64

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Check version and bundled bank
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)\s*$' | Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec.yaml has no version line.' }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          if ($version -ne '1.3.0+14') {
            throw "Expected pubspec version 1.3.0+14 (found '$version')."
          }
          $bank = Get-Content -Raw -Path assets/cricket.json
          $count = ([regex]::Matches($bank, '"question"\s*:')).Count
          if ($count -ne 3764) {
            throw "Bundled bank has $count questions; expected 3764."
          }
          Write-Host "Version $version, bundled questions $count"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Release contents
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $exe = Join-Path $release "cisco_quiz.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }
          if (Test-Path "CiscoQuiz-1.3.0-Windows.zip") {
            Remove-Item -Force "CiscoQuiz-1.3.0-Windows.zip"
          }
          tar.exe -a -cf "CiscoQuiz-1.3.0-Windows.zip" -C $release .
          $listing = tar.exe -tf "CiscoQuiz-1.3.0-Windows.zip"
          $listing | Select-String -Pattern "cisco_quiz.exe" -SimpleMatch | Out-Host
          if (-not ($listing | Select-String -Pattern "cisco_quiz.exe" -SimpleMatch)) {
            throw "Zip is missing cisco_quiz.exe"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CiscoQuiz-1.3.0-Windows
          path: CiscoQuiz-1.3.0-Windows.zip
          if-no-files-found: error
          compression-level: 0

      # Branch and manual builds only upload the workflow artifact; the
      # GitHub release is created/updated only from the v1.3.0 tag.
      - name: Attach zip to release v1.3.0
        if: github.ref == 'refs/tags/v1.3.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = "${{ github.repository }}"
          gh release view v1.3.0 --repo $repo
          if ($LASTEXITCODE -ne 0) {
            $notes = @"
          Cisco Quiz 1.3.0+14.

          - CiscoQuiz-1.3.0-arm64.apk is signed with the stable release key (CN=Cisco Quiz). Certificate SHA-256: 45:3D:1D:C9:48:6E:76:F4:F5:2B:C5:16:B5:10:5A:9F:AF:D8:DF:87:CF:EC:F1:25:DC:A4:E4:54:5B:F0:E6:D8.
          - Same release key as 1.2.11: installs over 1.2.11 without uninstalling.
          - versionName 1.3.0; arm64 split versionCode 2014 (14 + arm64 offset 2000).
          - CiscoQuiz-1.3.0-Windows.zip is the Release folder at the archive root.
          - Bundled bank v4.3.0: 3764 questions in 12 tracks (CCST, CCNA, CCNP, Cybersecurity, CCST IT, IIoT, Field, Automation, Wireless, SD-WAN/SD-Access, Data Center, Collaboration). Quizzes by exam and theme come from data/quiz-catalog.json (21 quizzes; alsoFrom adds tagged CCNA/CCNP items), bundled as fallback and refreshed online by SHA-256.
          - Site: https://fgrilo80.github.io/cricket/
          "@
            gh release create v1.3.0 --repo $repo --target "${{ github.sha }}" --title "Cisco Quiz 1.3.0 — quizzes por exame e tema" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
          }
          Write-Host "Assets before upload:"
          gh release view v1.3.0 --repo $repo --json assets --jq ".assets[].name"
          gh release upload v1.3.0 "CiscoQuiz-1.3.0-Windows.zip" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
          Write-Host "Assets after upload:"
          gh release view v1.3.0 --repo $repo --json assets --jq ".assets[].name"
